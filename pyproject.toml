[project]
name = "you-cant-pick-an-llm-provider-from-the-price-list"
version = "0.1.0"
description = "You Can't Pick an LLM Provider From the Price List"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
    "pydantic>=2.0",
    "pytest>=8.0",
    "streamlit>=1.66.1",
    "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "altair", "altair.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
